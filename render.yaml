# One-click deploy: https://render.com/deploy?repo=https://github.com/archie-arya/tracelens
services:
  - type: web
    name: tracelens
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TRACELENS_DATABASE_URL
        fromDatabase:
          name: tracelens-db
          property: connectionString
databases:
  - name: tracelens-db
    plan: free
