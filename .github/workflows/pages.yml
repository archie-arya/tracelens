name: Deploy dashboard demo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          cd dashboard && npm ci
          rm -rf public/demo-data && cp -r ../demo/snapshot public/demo-data
          VITE_STATIC_DEMO=1 VITE_BASE=/tracelens/ npx vite build
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dashboard/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
