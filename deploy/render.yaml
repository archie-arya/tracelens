# Optional shared team instance on Render: New -> Blueprint, point it at this repo and set the blueprint path to deploy/render.yaml
services:
  - type: web
    name: tracelens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TRACELENS_DATABASE_URL
        fromDatabase:
          name: tracelens-db
          property: connectionString
databases:
  - name: tracelens-db
    plan: free
