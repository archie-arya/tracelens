[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tracelens-server"
version = "0.2.0"
description = "TraceLens server: ingestion, query API, metrics, evaluations and alerts for LLM apps."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "httpx>=0.25",
  "opentelemetry-proto>=1.20",
  "protobuf>=4.21",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
tracelens-server = "tracelens_server.cli:main"

[project.entry-points."tracelens.evaluators"]

[tool.hatch.build.targets.wheel]
packages = ["tracelens_server"]
artifacts = ["tracelens_server/static/**"]   # bundled dashboard build (git-ignored, included when present)

[tool.pytest.ini_options]
asyncio_mode = "auto"
