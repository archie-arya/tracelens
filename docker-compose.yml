# Self-host TraceLens in one command:  docker compose up -d   ->  http://localhost:8000
# Uses Postgres; for a single-container SQLite setup just run:  docker run -p 8000:8000 -v tl:/data ghcr.io/... (see README)
services:
  tracelens:
    build: .
    ports: ["8000:8000"]
    environment:
      TRACELENS_DATABASE_URL: postgresql://tracelens:tracelens@db:5432/tracelens
      # Fixed key for the "default" project so your apps can start sending immediately (change it!)
      TRACELENS_INIT_API_KEY: ${TRACELENS_INIT_API_KEY:-tl-sk-local-dev-change-me}
      # Free LLM-as-judge evaluations (https://aistudio.google.com/apikey). Or GROQ_API_KEY / OLLAMA_BASE_URL.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      TRACELENS_JUDGE_MODELS: ${TRACELENS_JUDGE_MODELS:-gemini:gemini-flash-lite-latest,gemini:gemini-3.1-flash-lite,groq:llama-3.1-8b-instant}
      TRACELENS_PUBLIC_DEMO: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens
      POSTGRES_DB: tracelens
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens"]
      interval: 3s
      retries: 20
    restart: unless-stopped
volumes:
  pgdata:
