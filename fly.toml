# fly launch --copy-config --no-deploy && fly volumes create tracelens_data --size 1 && fly secrets set GEMINI_API_KEY=... && fly deploy
app = "tracelens"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  TRACELENS_DATABASE_URL = "sqlite:////data/tracelens.db"

[mounts]
  source = "tracelens_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
